# Configuracao LOCAL segura. Nao contem publish de proposito.
# Para releases com GitHub updater, os scripts usam electron-builder.config.cjs
# com HOSTDECK_RELEASE=1.
appId: com.hostdeck.desktop
productName: HostDeck
executableName: HostDeck
directories:
  output: dist
  buildResources: build
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
files:
  - electron/**/*
  - build/icon.png
  - build/icon.ico
  - build/icon.icns
  - package.json
extraResources:
  - from: .hostdeck-runtime/server.js
    to: standalone/server.js
  - from: .hostdeck-runtime/package.json
    to: standalone/package.json
  - from: .hostdeck-runtime/.next
    to: standalone/.next
    filter:
      - "**/*"
  - from: .hostdeck-runtime/runtime_modules
    to: standalone/runtime_modules
    filter:
      - "**/*"
  - from: .hostdeck-runtime/public
    to: standalone/public
    filter:
      - "**/*"
asar: true
win:
  icon: build/icon.ico
  artifactName: "HostDeck-Setup-${version}-${arch}.${ext}"
  target:
    - nsis
nsis:
  oneClick: false
  shortcutName: HostDeck
  uninstallDisplayName: HostDeck
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
mac:
  icon: build/icon.icns
  target:
    - dmg
    - zip
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Utility
